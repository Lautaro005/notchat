name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Do not file it here — use [private reporting](https://github.com/Lautaro005/notchat/security/advisories/new).
        Never paste messages, phone numbers or screenshots of real chats.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Notchat version
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations: { required: true }
  - type: dropdown
    id: ai
    attributes:
      label: AI provider
      options: [None, Ollama, LM Studio, llama.cpp, Notchat llama.cpp]
