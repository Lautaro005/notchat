[package]
name = "notchat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-transport", "tokio-runtime", "ureq-client"] }
whatsapp-rust-sqlite-storage = { version = "=0.7.0", default-features = false }
libsqlite3-sys = { version = "0.40", features = ["bundled-sqlcipher"] }
rusqlite = { version = "0.43" }
diesel = { version = "2.4", default-features = false, features = ["sqlite"] }
security-framework = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
rand = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
scraper = "0.29"
url = "2"
base64 = "0.23"
sha2 = "0.11"
pdf-extract = "0.12"

[dev-dependencies]
tempfile = "3"
